name: Build client

on:
  push:
    tags: ['client-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build client/SleepyClient.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: SleepyClient
          path: client/bin/Release/net48/SleepyClient.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: client/bin/Release/net48/SleepyClient.exe
          name: Sleepy Client ${{ github.ref_name }}
          body: |
            Native Windows PC client for Sleepy Package Installer. Download `SleepyClient.exe`, run it and press **Connect**.
            Needs only .NET Framework 4.8 (built into Windows 10/11). See `client/README.md`.
